<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sudip's Coding Project</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef6ff;
            padding: 50px;
        }

        .project-card {
            position: relative;
            width: 280px;
            height: 180px;
            background: white;
            border: 2px solid #2563eb;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
        }

        .new-badge {
            position: absolute;
            top: -12px;
            right: -10px;
            background: #2563eb;
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        h2 {
            color: #1e40af;
            margin-top: 25px;
        }

        p {
            color: #475569;
        }
    </style>
</head>

<body>

    <div class="project-card">

        <span class="new-badge">NEW</span>

        <h2>Sudip's Project</h2>

        <p>
            Computer Engineering student learning
            HTML and CSS at Gachon University.
        </p>

    </div>

</body>
</html>
