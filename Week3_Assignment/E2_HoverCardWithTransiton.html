<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sudip's Study Card</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f8fafc;
            padding: 60px;
        }

        .study-card {
            width: 300px;
            padding: 25px;
            background: white;
            border-radius: 16px;
            border: 1px solid #dbeafe;

            transition:
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        .study-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 30px rgba(37, 99, 235, 0.25);
        }

        h2 {
            color: #2563eb;
        }

        p {
            color: #64748b;
            line-height: 1.6;
        }

        .topic {
            display: inline-block;
            background: #dbeafe;
            color: #1d4ed8;
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="study-card">

        <span class="topic">Computer Engineering</span>

        <h2>My Study Card</h2>

        <p>
            I am learning web development and
            practicing CSS for my university classes.
        </p>

    </div>

</body>
</html>
