<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 12 React State | Sudip Sah</title>
<link rel="stylesheet" href="../assets/week11-hub.css">
<style>

main{max-width:1100px;margin:auto;padding:clamp(14px,4vw,48px)}header{padding:0 0 20px}h1{font-size:clamp(2rem,6vw,4rem);line-height:1;margin:.55em 0 .25em}h2,h3{line-height:1.2}a{color:#f9a8d4}
section.task{margin-bottom:14px;scroll-margin-top:20px}article,aside{border:1px solid var(--line);border-radius:12px;padding:16px;background:#211b21;min-width:0}
.shop{display:grid;grid-template-columns:2fr 1fr;gap:14px}.products,.labs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:12px}.labs{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.products img{display:block;width:100%;height:160px;object-fit:contain;background:#f4f2f1;border-radius:10px;padding:10px}button,input,textarea{font:inherit}button{border:1px solid #a85763;border-radius:8px;padding:.4rem .7rem;background:#40222a;color:inherit;cursor:pointer;margin:.15rem}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){background:#74303d}
:focus-visible{outline:3px solid #ffd68e;outline-offset:2px}textarea,input:not([type=checkbox]){display:block;width:100%;background:#110e12;border:1px solid #a85763;color:inherit;border-radius:8px;padding:.5rem;margin:.35rem 0}textarea{resize:vertical}.controls{display:flex;align-items:center;flex-wrap:wrap;gap:6px}li{margin-block:.4rem;overflow-wrap:anywhere}
.jump{margin-bottom:24px}.jump a{border:1px solid var(--line);padding:8px 12px;border-radius:6px}.jump a:hover{border-color:var(--red)}.task:target{border-color:var(--red)}
@media(max-width:740px){.shop{grid-template-columns:1fr}}
main .hero{padding:36px 0 22px}
.workspace{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;align-items:start;padding-bottom:40px}
.exercise-menu{display:grid;gap:6px;padding:16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.exercise-menu h2,.exercise-menu p{margin:0}.exercise-menu progress{width:100%;accent-color:var(--red);margin-bottom:8px}
.exercise-menu button{text-align:left;margin:0}.exercise-menu button[aria-pressed=true]{border-color:#ff7180;background:#652530}
.exercise-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.exercise-stage .task:hover{transform:none}.exercise-stage .task h2{margin-top:0}
@media(max-width:780px){.workspace{grid-template-columns:1fr}.exercise-menu{grid-template-columns:repeat(2,minmax(0,1fr))}.exercise-menu h2,.exercise-menu p,.exercise-menu progress{grid-column:1/-1}}
</style></head><body><div id="root"></div><noscript>Enable JavaScript to use the React exercises.</noscript>
<script type="module">
import {r as loadReact,n as loadDOM} from "../Week11%20monday/assets/jsx-runtime-D0USXF-_.js";
const {useState,createElement:h}=loadReact();
const {createRoot}=loadDOM();
const button=(label,action,props={})=>h('button',{type:'button',onClick:action,...props},label);
const sections=[
  ['cart','Shopping Cart'],['counter','Counter with History'],['scoreboard','Two-Player Scoreboard'],
  ['words','Live Word Count'],['tips','Quick React Tip'],['queue','Study Queue']
];
const card=(title,...children)=>{
  const id=sections.find(([,label])=>title.endsWith(label))[0];
  return h('section',{className:'task',id,'aria-labelledby':id+'-title'},h('h2',{id:id+'-title'},title),...children);
};
const money=new Intl.NumberFormat('en-KR',{style:'currency',currency:'KRW'});
const products=[
  [1,"Marshall Monitor III A.N.C.",449000,"https://www.fujiya-avic.co.jp/img/goods/1/200000069895_1.jpg"],
  [2,"Acer Predator Helios 16",2390000,"https://cdn.gamenotebaku.az/productimg/111/530/gamenote_img_16_1718911127.png.webp"],
  [3,"13-inch iPad Pro (M5)",1990000,"https://lcdn.altex.ro/media/catalog/product/i/p/ipad_pro_13inch_m5_wifi_space_black_2_1fc50113.jpg"],
  [4,"iPhone 17 Pro Max (Silver)",1990000,"https://www.aucklanddutyfree.co.nz/media/catalog/product/1/0/101506045_0_45d6.jpg?width=800"],
  [5,"16-inch MacBook Pro (M5 Max)",5490000,"https://www.svacampusstore.com/cdn/shop/files/mbp16-silver-select-202603_5cad1269-b08d-453e-bb9c-242dabb96fb2.png?v=1772557311&width=1000"]
].map(([id,name,price,image])=>({id,name,price,image}));
function ShoppingCart(){
  const [items,setItems]=useState([]);
  function change(product,delta){
    setItems(previous=>{
      const item=previous.find(row=>row.id===product.id);
      if(!item) return delta>0?[...previous,{...product,quantity:1}]:previous;
      if(item.quantity+delta<=0) return previous.filter(row=>row.id!==product.id);
      return previous.map(row=>row.id===product.id?{...row,quantity:row.quantity+delta}:row);
    });
  }
  const total=items.reduce((sum,item)=>sum+item.price*item.quantity,0);
  return card('Tech Desk · Shopping Cart',
    h('div',{className:'shop'},
      h('div',{className:'products'},products.map(product=>h('article',{key:product.id},
        h('img',{src:product.image,alt:product.name,width:320,height:220,decoding:'async'}),
        h('h3',null,product.name),h('p',null,money.format(product.price)),
        button('Add',()=>change(product,1),{'aria-label':'Add '+product.name})))),
      h('aside',{'aria-label':'Cart'},h('h3',null,'Your cart'),h('p',null,'Demo prices in KRW'),
        items.length===0?h('p',null,'Your cart is empty.'):h('ul',null,items.map(item=>h('li',{key:item.id},
          h('strong',null,item.name),h('div',{className:'controls'},
          button('−',()=>change(item,-1),{'aria-label':'Decrease '+item.name}),
          h('span',null,item.quantity),
          button('+',()=>change(item,1),{'aria-label':'Increase '+item.name}),
          button('Remove',()=>setItems(previous=>previous.filter(row=>row.id!==item.id)),{'aria-label':'Remove '+item.name}))))),
        h('p',{role:'status'},'Total: '+money.format(total)),button('Clear cart',()=>setItems([]),{disabled:items.length===0}))));
}
function Counter(){
  const [count,setCount]=useState(0);
  const [history,setHistory]=useState([0]);
  function save(next){
    if(next===count)return;
    setCount(next);
    setHistory(previous=>[...previous,next].slice(-5));
  }
  function undo(){
    if(history.length<2)return;
    setCount(history[history.length-2]);
    setHistory(previous=>previous.slice(0,-1));
  }
  return card('Counter with History',h('p',{role:'status'},'Count: '+count),
    h('div',{className:'controls'},button('+1',()=>save(count+1)),button('−1',()=>save(count-1)),button('Reset',()=>save(0)),button('Undo',undo,{disabled:history.length<2})),
    h('p',null,'Last five values: '+history.join(' → ')));
}
function PlayerScore({name,score,update}){
  return h('article',null,h('h3',null,name+': '+score),button('−',()=>update(-1),{'aria-label':'Decrease '+name}),button('+',()=>update(1),{'aria-label':'Increase '+name}));
}
function ScoreBoard(){
  const [first,setFirst]=useState(0);
  const [second,setSecond]=useState(0);
  return card('Two-Player Scoreboard',h('div',{className:'controls'},
    h(PlayerScore,{name:'Player 1',score:first,update:delta=>setFirst(previous=>previous+delta)}),
    h(PlayerScore,{name:'Player 2',score:second,update:delta=>setSecond(previous=>previous+delta)})),
    h('p',{role:'status'},'Combined score: '+(first+second)),button('Reset scores',()=>{setFirst(0);setSecond(0)}));
}
function WordCount(){
  const [text,setText]=useState('');
  const words=text.trim()?text.trim().split(/\s+/).length:0;
  return card('Live Word Count',h('label',null,'Practice notes',h('textarea',{rows:4,value:text,onChange:e=>setText(e.target.value)})),
    h('p',{role:'status'},words+' words · '+text.length+' characters'),button('Clear notes',()=>setText(''),{disabled:!text}));
}
const tips=['Call useState at the top level of your component.','Use a new array when adding or removing items.','Keep shared state in the closest common parent.'];
function QuickTip(){
  const [open,setOpen]=useState(false);
  const [index,setIndex]=useState(0);
  return card('Quick React Tip',button(open?'Hide details':'Show details',()=>setOpen(previous=>!previous),{'aria-expanded':open,'aria-controls':'tip-details'}),
    h('div',{id:'tip-details',hidden:!open},h('p',{role:'status'},tips[index]),button('Next tip',()=>setIndex(previous=>(previous+1)%tips.length))));
}
function StudyQueue(){
  const [input,setInput]=useState('');
  const [items,setItems]=useState([]);
  function add(event){
    event.preventDefault();
    const title=input.trim();
    if(!title)return;
    const id=crypto.randomUUID();
    setItems(previous=>[...previous,{id,title,done:false}]);
    setInput('');
  }
  return card('Study Queue',h('form',{onSubmit:add},h('label',null,'New study task',h('input',{value:input,onChange:e=>setInput(e.target.value),required:true})),h('button',{type:'submit'},'Add')),
    h('p',{role:'status'},items.filter(item=>item.done).length+' of '+items.length+' complete'),
    button('Clear completed',()=>setItems(previous=>previous.filter(item=>!item.done)),{disabled:!items.some(item=>item.done)}),
    h('ul',null,items.map(item=>h('li',{key:item.id},h('label',null,h('input',{type:'checkbox',checked:item.done,onChange:()=>setItems(previous=>previous.map(row=>row.id===item.id?{...row,done:!row.done}:row))}),item.title),
      button('Remove',()=>setItems(previous=>previous.filter(row=>row.id!==item.id)),{'aria-label':'Remove '+item.title})))));
}
const exercises=[ShoppingCart,Counter,ScoreBoard,WordCount,QuickTip,StudyQueue];
function App(){
  const [active,setActive]=useState(0);
  const [practiced,setPracticed]=useState([]);
  const [id,label]=sections[active];
  const done=practiced.includes(id);
  function togglePractice(){
    setPracticed(previous=>previous.includes(id)?previous.filter(item=>item!==id):[...previous,id]);
  }
  return h('main',{className:'shell'},
    h('header',{className:'header'},
      h('a',{className:'brand',href:'../#coursework'},'SUDIP',h('span',null,' / LAB')),
      h('nav',{'aria-label':'Course navigation'},h('a',{href:'../#coursework'},'Coursework'))),
    h('div',{className:'hero'},
      h('p',{className:'eyebrow'},'WEEK 12 MONDAY / WEB PROGRAMMING'),
      h('h1',null,'REACT ',h('span',null,'STATE'))),
    h('div',{className:'workspace'},
      h('div',{className:'exercise-menu'},
        h('h2',null,'Exercises'),
        h('p',{role:'status'},practiced.length+' of '+sections.length+' practiced'),
        h('progress',{max:sections.length,value:practiced.length,'aria-label':'Practice progress'}),
        sections.map(([key,name],index)=>button(name,()=>setActive(index),{
          key,'aria-pressed':active===index,'aria-controls':'panel-'+key,
          'aria-label':name+(practiced.includes(key)?', practiced':'')
        }))),
      h('div',{className:'exercise-stage'},
        h('div',{className:'exercise-toolbar'},h('span',{className:'eyebrow'},active===0?'HOMEWORK':'PRACTICE'),
          button(done?'Practiced ✓':'Mark as practiced',togglePractice,{'aria-pressed':done})),
        sections.map(([key,name],index)=>h('div',{key,id:'panel-'+key,hidden:active!==index},h(exercises[index]))),
        h('div',{className:'exercise-toolbar'},
          button('← Previous',()=>setActive(previous=>previous-1),{disabled:active===0}),
          h('span',{className:'eyebrow',role:'status'},label+' · '+(active+1)+' / '+sections.length),
          button('Next →',()=>setActive(previous=>previous+1),{disabled:active===sections.length-1})))));
}
createRoot(document.querySelector('#root')).render(h(App));
</script></body></html>
