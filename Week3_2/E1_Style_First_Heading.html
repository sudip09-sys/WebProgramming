<title>E1 - Style Your First Heading - Sudip Sah</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f0fdf4; color: #1e293b; padding: 30px; line-height: 1.6; }
.card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #bbf7d0; }
h1, h2, h3 { color: #15803d; }
.badge { display:inline-block; background:#dcfce7; color:#15803d; padding:5px 12px; border-radius:20px; margin:4px; font-weight:bold; }
h1{color:#15803d;text-align:center;font-size:2.5rem}p{color:#64748b;font-size:1.1rem}</style>
</head>
<body>
<div class="card">
<p><strong>Sudip Sah</strong> · Computer Engineering · Gachon University</p>
<h1>Sudip Sah</h1><p>Computer Engineering Student at Gachon University.</p>
</div>
</body>
