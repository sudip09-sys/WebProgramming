<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>E3 - Color Palette Card - Sudip Sah</title>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; background: #f0fdf4; color: #1e293b; padding: 30px; line-height: 1.6; }
.card { max-width: 800px; margin: auto; background: white; padding: 30px; border-radius: 16px; border: 1px solid #bbf7d0; }
h1, h2, h3 { color: #15803d; }
.badge { display:inline-block; background:#dcfce7; color:#15803d; padding:5px 12px; border-radius:20px; margin:4px; font-weight:bold; }
.palette{display:flex;gap:12px;padding:20px;background:#f8fafc}.palette div{width:100px;height:100px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;font-family:monospace}.palette div:nth-child(1){background:#EF4444}.palette div:nth-child(2){background:#F59E0B}.palette div:nth-child(3){background:#10B981}.palette div:nth-child(4){background:#3B82F6}.palette div:nth-child(5){background:#8B5CF6}</style>
</head>
<body>
<div class="card">
<p><strong>Sudip Sah</strong> · Computer Engineering · Gachon University</p>
<h1>Sudip's Color Palette</h1><div class="palette"><div>#EF4444</div><div>#F59E0B</div><div>#10B981</div><div>#3B82F6</div><div>#8B5CF6</div></div>
</div>
</body>
</html>
